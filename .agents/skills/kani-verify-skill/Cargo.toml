[package]
name = "kani-verify"
version = "0.1.0"
edition = "2021"
description = "Orchestrate Kani verification for Rust code — harness generation, output parsing, LLM-guided iteration"

[[bin]]
name = "kani-verify"
path = "src/main.rs"

[dependencies]
# AST / code generation
syn = { version = "2", features = ["full", "extra-traits", "visit"] }
quote = "1"
proc-macro2 = "1"

# async process
tokio = { version = "1", features = ["process", "io-util", "rt-multi-thread", "macros", "time", "fs"] }

# CLI
clap = { version = "4", features = ["derive"] }

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# error handling
thiserror = "1"
anyhow = "1"

# templates
askama = "0.12"

# logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# utils
walkdir = "2"
tempfile = "3"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
